name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag (e.g. v1.2) to attach Windows assets to"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -q

      - name: Build Windows portable ZIP and installer
        shell: pwsh
        run: ./packaging/windows/build_windows.ps1

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Push-Location dist
          $files = Get-ChildItem -File | Where-Object { $_.Name -like "Zardit-*-win64-*" } | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path ../SHA256SUMS-windows.txt -Encoding ascii
          Pop-Location
          Get-Content SHA256SUMS-windows.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: zardit-windows-x64
          path: |
            dist/Zardit-*-win64-*.zip
            dist/Zardit-*-win64-*.exe
            SHA256SUMS-windows.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          files: |
            dist/Zardit-*-win64-*.zip
            dist/Zardit-*-win64-*.exe
            SHA256SUMS-windows.txt
          generate_release_notes: true
