name: CI (Linux)

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "zardit_core/**"
      - "requirements*.txt"
      - "assets/**"
      - "packaging/linux/**"
      - "tests/**"
      - ".github/workflows/ci-linux.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.py"
      - "zardit_core/**"
      - "requirements*.txt"
      - "assets/**"
      - "packaging/linux/**"
      - "tests/**"
      - ".github/workflows/ci-linux.yml"
      - ".github/workflows/release.yml"

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for Qt and desktop validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            ffmpeg \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Lint runtime modules and all tests
        run: |
          python -m pyflakes \
            config.py desktop.py downloader.py gui.py history.py \
            logs.py main.py theme.py updater.py zardit_app.py \
            zardit_core/*.py tests/*.py

      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/zardit.desktop

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
