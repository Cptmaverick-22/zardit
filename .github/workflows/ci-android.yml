name: CI (Android)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests & build slim arm64-v8a APKs
        working-directory: android
        run: ./gradlew testDebugUnitTest :app:assembleRelease :ffmpeg-addon:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m"

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: zardit-android-arm64
          path: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/ffmpeg-addon/build/outputs/apk/release/ffmpeg-addon-arm64-v8a-release.apk
