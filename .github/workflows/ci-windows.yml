name: CI (Windows)

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "requirements*.txt"
      - "assets/**"
      - "packaging/windows/**"
      - "tests/**"
      - ".github/workflows/ci-windows.yml"
      - ".github/workflows/release-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.py"
      - "requirements*.txt"
      - "assets/**"
      - "packaging/windows/**"
      - "tests/**"
      - ".github/workflows/ci-windows.yml"
      - ".github/workflows/release-windows.yml"

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Lint runtime modules and updated tests
        run: python -m pyflakes config.py desktop.py downloader.py gui.py history.py logs.py main.py theme.py updater.py zardit_app.py tests/test_names.py tests/test_ui.py

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
