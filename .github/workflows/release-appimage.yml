name: Release AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            file \
            libfuse2 \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            patchelf \
            unzip

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -q

      - name: Build portable AppImage
        run: |
          chmod +x packaging/linux/AppRun packaging/linux/build_appimage.sh packaging/linux/install_local.sh
          ./packaging/linux/build_appimage.sh

      - name: Generate SHA256 checksum
        run: |
          (cd dist && sha256sum Zardit-*-x86_64.AppImage > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: zardit-linux-x86_64-appimage
          path: |
            dist/Zardit-*-x86_64.AppImage
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Zardit-*-x86_64.AppImage
            SHA256SUMS.txt
          generate_release_notes: true
